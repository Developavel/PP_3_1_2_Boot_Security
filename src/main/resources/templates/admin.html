<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panel</title>

  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- ==================== ВЕРХНЯЯ ПАНЕЛЬ ==================== -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ==================== ОСНОВНОЕ СОДЕРЖИМОЕ ==================== -->
<div class="container-fluid">
  <div class="row">

    <div class="col-2">
      <div th:replace="~{fragments/sidebar :: sidebar(activePage='admin')}"></div>
    </div>

    <div class="col-10 content">
      <h1 class="page-title">Admin panel</h1>

      <div class="card">
        <div class="card-header p-0">
          <ul class="nav nav-tabs card-header-tabs" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="users-table-tab" data-bs-toggle="tab"
                      data-bs-target="#users-table" type="button" role="tab">
                Users table
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="new-user-tab" data-bs-toggle="tab"
                      data-bs-target="#new-user" type="button" role="tab">
                New User
              </button>
            </li>
          </ul>
        </div>

        <div class="card-body p-0">
          <div class="tab-content">

            <!-- ==================== ВКЛАДКА: ТАБЛИЦА ПОЛЬЗОВАТЕЛЕЙ ==================== -->
            <div class="tab-pane fade show active p-0" id="users-table" role="tabpanel">
              <div class="border-bottom p-3">
                <h4 class="m-0">All users</h4>
              </div>

              <div class="p-3">
                <div id="message-container"></div>

                <table class="table table-striped align-middle">
                  <thead>
                  <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Edit</th>
                    <th>Delete</th>
                  </tr>
                  </thead>
                  <tbody id="users-table-body">
                  </tbody>
                </table>
              </div>
            </div>

            <!-- ==================== ВКЛАДКА: СОЗДАНИЕ ПОЛЬЗОВАТЕЛЯ ==================== -->
            <div class="tab-pane fade p-4" id="new-user" role="tabpanel">

              <form id="createUserForm" class="form-wrapper">

                <div class="mb-3">
                  <label class="form-label fw-bold">First name</label>
                  <input type="text" class="form-control" name="firstName" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Last name</label>
                  <input type="text" class="form-control" name="lastName" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Age</label>
                  <input type="number" class="form-control" name="age" min="1" max="150" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Email</label>
                  <input type="email" class="form-control" name="email" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Password</label>
                  <input type="password" class="form-control" name="password" minlength="4" required>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-bold">Role</label>
                  <select class="form-select" name="roleIds" multiple size="3" required>
                  </select>
                  <small class="text-muted">Hold Ctrl (or Cmd on Mac) to select multiple roles</small>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-success">Add new user</button>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== МОДАЛЬНОЕ ОКНО: РЕДАКТИРОВАНИЕ ==================== -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="editForm">
        <div class="modal-body">
          <input type="hidden" name="id" id="editUserId">

          <div class="mb-3">
            <label class="form-label fw-bold">ID</label>
            <input type="text" class="form-control" id="editUserIdDisplay" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">First name</label>
            <input type="text" class="form-control" name="firstName" id="editFirstName" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Last name</label>
            <input type="text" class="form-control" name="lastName" id="editLastName" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Age</label>
            <input type="number" class="form-control" name="age" id="editAge" min="1" max="150" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            <input type="email" class="form-control" name="email" id="editEmail" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Password</label>
            <input type="password" class="form-control" name="newPassword" id="editPassword" placeholder="Leave blank to keep current" minlength="4">
            <small class="text-muted">Leave blank to keep current password</small>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Role</label>
            <select class="form-select" name="roleIds" multiple size="3" id="editRoleIds" required>
            </select>
            <small class="text-muted">Select at least one role</small>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ==================== МОДАЛЬНОЕ ОКНО: УДАЛЕНИЕ ==================== -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirm deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="deleteForm">
        <div class="modal-body">
          <p class="text-danger fw-bold">Are you sure you want to delete this user?</p>

          <input type="hidden" name="id" id="deleteFormUserId">

          <div class="mb-3">
            <label class="form-label fw-bold">ID</label>
            <input type="text" class="form-control" id="deleteUserId" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">First name</label>
            <input type="text" class="form-control" id="deleteUserFirstName" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Last name</label>
            <input type="text" class="form-control" id="deleteUserLastName" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Age</label>
            <input type="text" class="form-control" id="deleteUserAge" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            <input type="text" class="form-control" id="deleteUserEmail" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Role</label>
            <input type="text" class="form-control" id="deleteUserRoles" readonly>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ==================== ПОДКЛЮЧЕНИЕ СКРИПТОВ ==================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/admin.js(v=${new java.util.Date().getTime()})}"></script>

</body>
</html>
