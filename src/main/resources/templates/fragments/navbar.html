<!-- Верхняя навигационная панель -->
<div th:fragment="navbar"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-dark bg-dark px-3">

        <!-- Текущий пользователь и его роли -->
        <div class="navbar-text text-white">

            <!-- Имя пользователя (email) -->
            <strong sec:authentication="name">
                user@mail.ru
            </strong>

            <span class="ms-1">with roles:</span>

            <!-- Список ролей пользователя -->
            <span th:each="role, stat : ${#authentication.authorities}">
                <span th:text="${#strings.replace(role.authority, 'ROLE_', '')}"></span>
                <span th:unless="${stat.last}">, </span>
            </span>

        </div>

        <!-- Кнопка выхода из системы -->
        <form class="ms-auto"
              th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="btn btn-link text-light text-decoration-none p-0">
                Logout
            </button>

        </form>

    </nav>

</div>
