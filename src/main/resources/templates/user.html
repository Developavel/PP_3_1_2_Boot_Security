<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>User information page</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Верхняя панель с информацией о текущем пользователе -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">

    <div class="row">

        <!-- Боковое меню навигации -->
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: sidebar(activePage='user')}"></div>
        </div>

        <!-- Основное содержимое страницы -->
        <main class="col-md-10 content p-4">

            <h1 class="h2 mb-4">User information page</h1>

            <div class="card">

                <!-- Навигационная вкладка страницы -->
                <div class="card-header p-0">
                    <ul class="nav nav-tabs card-header-tabs">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                About user
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="card-body">

                    <h5 class="card-title mb-3">About user</h5>

                    <!-- Таблица с информацией о текущем пользователе -->
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody id="user-info-body">
                            <!-- Данные загружаются через JavaScript -->
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script th:src="@{/js/utils.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/user.js}"></script>

</body>
</html>
