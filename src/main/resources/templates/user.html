<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body>

<h2 th:text="${user.username} + ', welcome to your profile!'"></h2>

<p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
<p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
<p><strong>Lastname:</strong> <span th:text="${user.lastname}"></span></p>
<p><strong>Roles:</strong>
    <span th:each="role, iterStat : ${user.roles}">
        <span th:text="${role.name}"></span><span th:if="${!iterStat.last}">, </span>
    </span>
</p>

<br/>

<form method="POST" th:action="@{/logout}">
    <button type="submit">Logout</button>
</form>

</body>
</html>
