<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <meta charset="UTF-8">
    <title>User information-page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .top-navbar {
            background-color: #343a40;
            color: white;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .sidebar {
            min-height: calc(100vh - 60px);
            background: white;
            border-right: 1px solid #dee2e6;
            padding-top: 20px;
        }

        .sidebar .nav-link {
            color: #0d6efd;
        }

        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .page-title {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .card-header {
            background-color: #f8f9fa;
            font-size: 28px;
            font-weight: 500;
        }

        .logout-link {
            color: white;
            text-decoration: none;
        }

        .logout-link:hover {
            color: #ccc;
        }
    </style>
</head>

<body>

<!-- Верхняя панель -->
<div class="top-navbar">
    <div>
        <strong>
            <span sec:authentication="name">user@mail.ru</span>
        </strong>
        with roles:
        <span th:each="role, iterStat : ${#authentication.authorities}">
            <span th:text="${#strings.replace(role.authority, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
        </span>
    </div>

    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-link logout-link">
            Logout
        </button>
    </form>
</div>

<div class="container-fluid">
    <div class="row">

        <!-- Левое меню -->
        <div class="col-2 sidebar p-0">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/user}">
                        User
                    </a>
                </li>

                <!-- Ссылка на Admin видна только пользователям с ролью ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">
                        Admin
                    </a>
                </li>
            </ul>
        </div>

        <!-- Основной контент -->
        <div class="col-10 content">

            <h1 class="page-title">User information-page</h1>

            <div class="card">

                <div class="card-header p-0">
                    <ul class="nav nav-tabs card-header-tabs">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/user}">
                                About user
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="card-body p-0">

                    <div class="border-bottom p-3">
                        <h4 class="m-0">About user</h4>
                    </div>

                    <div class="p-3">
                        <table class="table table-striped align-middle">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td th:text="${user.id}">－</td>
                                <td th:text="${user.firstName}">－</td>
                                <td th:text="${user.lastName}">－</td>
                                <td th:text="${user.age}">－</td>
                                <td th:text="${user.email}">－</td>
                                <td>
                                        <span th:each="role, iterStat : ${user.roles}">
                                            <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
                                        </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
