<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit User</title>
</head>
<body>

<h2>Edit User</h2>

<form th:method="POST" th:action="@{/admin/edit}" th:object="${user}">
  <input type="hidden" th:field="*{id}">

  <label>Username:</label>
  <input type="text" th:field="*{username}"/><br/>

  <label>Lastname:</label>
  <input type="text" th:field="*{lastname}"/><br/>

  <label>New Password (optional):</label>
  <input type="password" name="newPassword"/><br/>

  <label>Roles:</label>
  <select name="roleIds" multiple>
    <option th:each="role : ${allRoles}"
            th:value="${role.id}"
            th:text="${role.name}"
            th:selected="${user.roles.contains(role)}">
    </option>
  </select>
  <small>Hold Ctrl to select multiple roles</small><br/>

  <input type="submit" value="Update"/>
</form>

<br/>
<form method="POST" th:action="@{/logout}">
  <input type="submit" value="Logout"/>
</form>

</body>
</html>
