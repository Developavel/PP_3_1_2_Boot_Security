<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
  <meta charset="UTF-8">
  <title>Delete user</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .top-navbar {
      background-color: #343a40;
      color: white;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .sidebar {
      min-height: calc(100vh - 60px);
      background: white;
      border-right: 1px solid #dee2e6;
    }

    .sidebar .nav-link {
      color: #0d6efd;
    }

    .sidebar .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }

    .content {
      padding: 30px;
    }

    .page-title {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .logout-link {
      color: white;
      text-decoration: none;
    }

    .info-table {
      max-width: 500px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<!-- Верхняя панель -->
<div class="top-navbar">
  <div>
    <strong>
      <span sec:authentication="name"></span>
    </strong>
    with roles:
    <span th:each="role, iterStat : ${#authentication.authorities}">
            <span th:text="${#strings.replace(role.authority, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
        </span>
  </div>

  <form th:action="@{/logout}" method="post" class="m-0">
    <button type="submit" class="btn btn-link logout-link">
      Logout
    </button>
  </form>
</div>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-2 sidebar p-0">
      <ul class="nav flex-column mt-3">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/admin}">
            Admin
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/user}">
            User
          </a>
        </li>
      </ul>
    </div>

    <!-- Контент -->
    <div class="col-10 content">

      <h1 class="page-title">Admin panel</h1>

      <div class="card">

        <!-- Tabs -->
        <div class="card-header p-0">
          <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item">
              <a class="nav-link active"
                 th:href="@{/admin}">
                Users table
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link"
                 th:href="@{/admin/new}">
                New User
              </a>
            </li>
          </ul>
        </div>

        <div class="card-body p-0">

          <div class="border-bottom p-3">
            <h4 class="m-0">Delete user</h4>
          </div>

          <div class="p-4">

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <div class="info-table">
              <table class="table table-bordered">
                <tbody>
                <tr><th style="width: 40%">ID</th><td th:text="${user.id}">－</td></tr>
                <tr><th>First name</th><td th:text="${user.firstName}">－</td></tr>
                <tr><th>Last name</th><td th:text="${user.lastName}">－</td></tr>
                <tr><th>Age</th><td th:text="${user.age}">－</td></tr>
                <tr><th>Email</th><td th:text="${user.email}">－</td></tr>
                <tr><th>Role</th>
                  <td>
                    <span th:each="role, iterStat : ${user.roles}">
                      <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
                    </span>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
              <a th:href="@{/admin}" class="btn btn-secondary">Close</a>

              <!-- Форма DELETE вместо ссылки -->
              <form th:action="@{/admin/delete}" method="post" style="display: inline;">
                <input type="hidden" name="id" th:value="${user.id}" />
                <button type="submit" class="btn btn-danger">Delete</button>
              </form>
            </div>

          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
