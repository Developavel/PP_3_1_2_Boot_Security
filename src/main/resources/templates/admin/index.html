<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .top-navbar {
            background-color: #343a40;
            color: white;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .sidebar {
            min-height: calc(100vh - 60px);
            background: white;
            border-right: 1px solid #dee2e6;
            padding-top: 20px;
        }

        .sidebar .nav-link {
            color: #0d6efd;
        }

        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .page-title {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .card-header {
            background-color: #f8f9fa;
            font-size: 28px;
            font-weight: 500;
        }

        .logout-link {
            color: white;
            text-decoration: none;
        }

        .logout-link:hover {
            color: #ccc;
        }

        .table td:last-child,
        .table th:last-child {
            text-align: center;
            min-width: 100px;
        }
    </style>
</head>

<body>

<!-- Верхняя панель -->
<div class="top-navbar">
    <div>
        <strong>
            <span sec:authentication="name">admin@mail.ru</span>
        </strong>
        with roles:
        <span th:each="role, iterStat : ${#authentication.authorities}">
            <span th:text="${#strings.replace(role.authority, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
        </span>
    </div>

    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-link logout-link">
            Logout
        </button>
    </form>
</div>

<div class="container-fluid">
    <div class="row">

        <!-- Левое меню -->
        <div class="col-2 sidebar p-0">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin}">
                        Admin
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user}">
                        User
                    </a>
                </li>
            </ul>
        </div>

        <!-- Основной контент -->
        <div class="col-10 content">

            <h1 class="page-title">Admin panel</h1>

            <div class="card">

                <!-- Табы -->
                <div class="card-header p-0">
                    <ul class="nav nav-tabs card-header-tabs">
                        <li class="nav-item">
                            <a class="nav-link active"
                               th:href="@{/admin}">
                                Users table
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/admin/new}">
                                New User
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="card-body p-0">

                    <div class="border-bottom p-3">
                        <h4 class="m-0">All users</h4>
                    </div>

                    <div class="p-3">
                        <table class="table table-striped align-middle">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.firstName}"></td>
                                <td th:text="${user.lastName}"></td>
                                <td th:text="${user.age}"></td>
                                <td th:text="${user.email}"></td>

                                <td>
                                    <span th:each="role, iterStat : ${user.roles}">
                                        <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
                                    </span>
                                </td>

                                <td class="text-center">
                                    <button type="button"
                                            class="btn btn-info text-white"
                                            data-bs-toggle="modal"
                                            data-bs-target="#editModal"
                                            th:data-user-id="${user.id}"
                                            th:data-user-first-name="${user.firstName}"
                                            th:data-user-last-name="${user.lastName}"
                                            th:data-user-age="${user.age}"
                                            th:data-user-email="${user.email}"
                                            th:data-user-roles-ids="${#strings.arrayJoin(user.roles.![id], ',')}">
                                        Edit
                                    </button>
                                </td>

                                <td class="text-center">
                                    <button type="button"
                                            class="btn btn-danger"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteModal"
                                            th:data-user-id="${user.id}"
                                            th:data-user-first-name="${user.firstName}"
                                            th:data-user-last-name="${user.lastName}"
                                            th:data-user-age="${user.age}"
                                            th:data-user-email="${user.email}"
                                            th:data-user-roles="${#strings.arrayJoin(user.roles.![name], ', ')}">
                                        Delete
                                    </button>
                                </td>
                        </table>

                        <tr th:if="${users.isEmpty()}">
                            <td colspan="8" class="text-center">
                                No users found
                            </td>
                        </tr>
                        </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Модальное окно редактирования пользователя -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" th:action="@{/admin/edit}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="editUserId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">ID</label>
                        <input type="text" class="form-control" id="editUserIdDisplay" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">First name</label>
                        <input type="text" class="form-control" name="firstName" id="editFirstName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" class="form-control" name="lastName" id="editLastName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Age</label>
                        <input type="number" class="form-control" name="age" id="editAge" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" name="email" id="editEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="newPassword" placeholder="Leave blank to keep current">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select" name="roleIds" multiple size="2" id="editRoleIds">
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.id}"
                                    th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                            </option>
                        </select>
                        <small class="text-muted">Hold Ctrl (or Cmd on Mac) to select multiple roles</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения удаления (в стиле полей) -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">ID</label>
                    <input type="text" class="form-control" id="deleteUserId" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">First name</label>
                    <input type="text" class="form-control" id="deleteUserFirstName" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Last name</label>
                    <input type="text" class="form-control" id="deleteUserLastName" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Age</label>
                    <input type="text" class="form-control" id="deleteUserAge" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="text" class="form-control" id="deleteUserEmail" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Role</label>
                    <input type="text" class="form-control" id="deleteUserRoles" readonly>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <a id="deleteConfirmLink" class="btn btn-danger">Delete</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Заполнение модального окна редактирования данными выбранного пользователя
    const editModal = document.getElementById('editModal');
    editModal.addEventListener('show.bs.modal', function(event) {
        const button = event.relatedTarget;

        const userId = button.getAttribute('data-user-id');
        const userFirstName = button.getAttribute('data-user-first-name');
        const userLastName = button.getAttribute('data-user-last-name');
        const userAge = button.getAttribute('data-user-age');
        const userEmail = button.getAttribute('data-user-email');
        const userRolesIds = button.getAttribute('data-user-roles-ids');

        document.getElementById('editUserId').value = userId;
        document.getElementById('editUserIdDisplay').value = userId;
        document.getElementById('editFirstName').value = userFirstName;
        document.getElementById('editLastName').value = userLastName;
        document.getElementById('editAge').value = userAge;
        document.getElementById('editEmail').value = userEmail;

        const roleSelect = document.getElementById('editRoleIds');
        for (let i = 0; i < roleSelect.options.length; i++) {
            roleSelect.options[i].selected = false;
        }

        if (userRolesIds) {
            const selectedRoleIds = userRolesIds.split(',');
            for (let i = 0; i < roleSelect.options.length; i++) {
                const option = roleSelect.options[i];
                if (selectedRoleIds.includes(option.value)) {
                    option.selected = true;
                }
            }
        }
    });

    // Заполнение модального окна удаления данными выбранного пользователя
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function(event) {
        const button = event.relatedTarget;

        const userId = button.getAttribute('data-user-id');
        const userFirstName = button.getAttribute('data-user-first-name');
        const userLastName = button.getAttribute('data-user-last-name');
        const userAge = button.getAttribute('data-user-age');
        const userEmail = button.getAttribute('data-user-email');
        const userRoles = button.getAttribute('data-user-roles');

        document.getElementById('deleteUserId').value = userId;
        document.getElementById('deleteUserFirstName').value = userFirstName;
        document.getElementById('deleteUserLastName').value = userLastName;
        document.getElementById('deleteUserAge').value = userAge;
        document.getElementById('deleteUserEmail').value = userEmail;

        const rolesWithoutPrefix = userRoles ? userRoles.replace(/ROLE_/g, '') : '';
        document.getElementById('deleteUserRoles').value = rolesWithoutPrefix;

        const deleteLink = document.getElementById('deleteConfirmLink');
        deleteLink.href = '/admin/delete?id=' + userId;
    });
</script>

</body>
</html>
