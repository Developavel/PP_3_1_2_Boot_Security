<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin panel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .top-navbar {
      background-color: #343a40;
      color: white;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .sidebar {
      min-height: calc(100vh - 60px);
      background: white;
      border-right: 1px solid #dee2e6;
    }

    .sidebar .nav-link {
      color: #0d6efd;
    }

    .sidebar .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }

    .content {
      padding: 30px;
    }

    .page-title {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .logout-link {
      color: white;
      text-decoration: none;
    }

    .form-wrapper {
      max-width: 400px;
      margin: 0 auto;
    }

    .form-wrapper label {
      font-weight: bold;
      text-align: center;
      width: 100%;
    }

    .form-wrapper input,
    .form-wrapper select {
      text-align: center;
    }
  </style>
</head>

<body>

<!-- Верхняя панель (исправлено отображение ролей) -->
<div class="top-navbar">
  <div>
    <strong>
      <span sec:authentication="name"></span>
    </strong>
    with roles:
    <span th:each="role, iterStat : ${#authentication.authorities}">
      <span th:text="${#strings.replace(role.authority, 'ROLE_', '')}"></span><span th:unless="${iterStat.last}">, </span>
    </span>
  </div>

  <form th:action="@{/logout}" method="post" class="m-0">
    <button type="submit" class="btn btn-link logout-link">
      Logout
    </button>
  </form>
</div>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-2 sidebar p-0">
      <ul class="nav flex-column mt-3">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/admin}">
            Admin
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/user}">
            User
          </a>
        </li>
      </ul>
    </div>

    <!-- Контент -->
    <div class="col-10 content">

      <h1 class="page-title">Admin panel</h1>

      <div class="card">

        <!-- Tabs -->
        <div class="card-header p-0">
          <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item">
              <a class="nav-link"
                 th:href="@{/admin}">
                Users table
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link active"
                 th:href="@{/admin/new}">
                New User
              </a>
            </li>
          </ul>
        </div>

        <!-- Форма -->
        <div class="card-body p-0">

          <div class="border-bottom p-3">
            <h4 class="m-0">Add new user</h4>
          </div>

          <div class="p-4">

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <form th:action="@{/admin}"
                  th:object="${user}"
                  method="post"
                  class="form-wrapper">

              <input type="hidden" th:field="*{id}">

              <div class="mb-3">
                <label>First name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{firstName}"
                       required>
              </div>

              <div class="mb-3">
                <label>Last name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{lastName}"
                       required>
              </div>

              <div class="mb-3">
                <label>Age</label>
                <input type="number"
                       class="form-control"
                       th:field="*{age}"
                       required>
              </div>

              <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       required>
              </div>

              <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       class="form-control"
                       th:field="*{password}"
                       required>
              </div>

              <div class="mb-4">
                <label>Role</label>

                <select class="form-select"
                        name="roleIds"
                        multiple
                        size="2">

                  <!-- Исправлено: отображение без префикса ROLE_ -->
                  <option th:each="role : ${allRoles}"
                          th:value="${role.id}"
                          th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                  </option>

                </select>
              </div>

              <div class="text-center">
                <button type="submit"
                        class="btn btn-success">
                  Add new user
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
