# MySQL
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/mydb
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

  # Hibernate
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show-sql: false
    hibernate:
      ddl-auto: update

# Admin initialization
